services:
  # Development services
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: identity
      POSTGRES_PASSWORD: "ymZD36x4BuCC58t76DQf51kP_ni0Bt0l"
    volumes:
      - identity_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "WJsEhFXGDNV6zHTT8KFXzcf-8U7l_Etc"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: pgvector/pgvector:pg16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: identity_test
      POSTGRES_PASSWORD: "4j5blCaxhOL9Ua_5BVSNb3YlACXYA4FK"
    volumes:
      - identity_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "yatGqz2n6-ATEJwLgZt094j9q5N9ZimO"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  identity_data:
  identity_test_data:
