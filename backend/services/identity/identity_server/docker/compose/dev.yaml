services:
  api:
    build:
      context: ../../..
      dockerfile: identity_server/docker/api/Dockerfile
    command: ["development", "default", "normal", "monolith", "true"]
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8181:8081"
      - "127.0.0.1:8182:8082"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault_agent:
        condition: service_healthy
    volumes:
      - ../config/serverpod-development.yaml:/app/config/development.yaml:ro
      - identity_vault_secrets:/run/vault/secrets:ro
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/livez"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  postgres:
    build:
      context: ../postgres
    user: "0:0"
    ports:
      - "127.0.0.1:8090:5432"
    depends_on:
      vault_agent:
        condition: service_healthy
    configs:
      - source: postgres_dev_config
        target: /run/config/postgres.conf
    volumes:
      - identity_data:/var/lib/postgresql/data
      - identity_vault_secrets:/run/vault/secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d identity"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    build:
      context: ../redis
    user: "0:0"
    ports:
      - "127.0.0.1:8091:6379"
    depends_on:
      vault_agent:
        condition: service_healthy
    volumes:
      - identity_vault_secrets:/run/vault/secrets:ro
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/vault/secrets/redis_password)\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
