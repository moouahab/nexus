### Short-lived code used to reset an identity password.
class: PasswordResetCode
serverOnly: true
table: password_reset_code
fields:
  id: UuidValue?, defaultPersist=random_v7
  identity: Identity?, relation(onDelete=Cascade)
  email: String
  ### Hashed reset code. Never store the raw code.
  codeHash: String
  createdAt: DateTime, default=now
  expiresAt: DateTime
  consumedAt: DateTime?
  failedAttempts: int, default=0

indexes:
  password_reset_code_identity_idx:
    fields: identityId
  password_reset_code_email_idx:
    fields: email
  password_reset_code_expires_at_idx:
    fields: expiresAt
