### Username/password credential linked to one technical identity.
class: PasswordCredential
serverOnly: true
table: password_credential
fields:
  id: UuidValue?, defaultPersist=random_v7

  ### The identity this credential belongs to.
  identity: Identity?, relation(onDelete=Cascade)

  ### Login username, stored normalized.
  username: String

  ### Password hash, stored in PHC format by the password hasher.
  passwordHash: String

  createdAt: DateTime, default=now
  updatedAt: DateTime?

indexes:
  password_credential_username_idx:
    fields: username
    unique: true

