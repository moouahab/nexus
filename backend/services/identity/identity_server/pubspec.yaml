name: identity_server
description: Starting point for a Serverpod server.
# version: 1.0.0
# homepage: https://www.example.com

environment:
  sdk: '^3.8.0'

resolution: workspace

dependencies:
  crypto: ^3.0.6
  dart_jsonwebtoken: ^3.4.1
  mailer: ^6.4.1
  nexus_auth:
    path: ../../../shared/nexus_auth
  redis: ^4.1.0
  serverpod: 3.4.11
  serverpod_auth_core_server: 3.4.11

dev_dependencies:
  lints: '>=3.0.0 <7.0.0'
  serverpod_test: 3.4.11
  test: ^1.25.5

serverpod:
  scripts:
    start: dart bin/main.dart --apply-migrations
