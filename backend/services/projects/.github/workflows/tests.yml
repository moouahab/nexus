name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      VERSION: '3.4.11'
      SERVERPOD_PASSWORD_database: 'change-me-postgres-test-password'
      SERVERPOD_PASSWORD_redis: 'change-me-redis-test-password'

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.32.8'

      - name: Start containers
        working-directory: projects_server
        run: docker compose up --quiet-pull --build -d

      - name: Install dependencies
        run: flutter pub get

      - name: Install Serverpod CLI
        run: dart pub global activate serverpod_cli $VERSION

      - name: Run Serverpod generator
        working-directory: projects_server
        run: serverpod generate

      - name: Run tests
        working-directory: projects_server
        run: dart test

      - name: Stop containers
        if: always()
        working-directory: projects_server
        run: docker compose down -v
