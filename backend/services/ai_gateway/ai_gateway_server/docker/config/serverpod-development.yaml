apiServer:
  port: 8080
  publicHost: localhost
  publicPort: 8580
  publicScheme: http
insightsServer:
  port: 8081
  publicHost: localhost
  publicPort: 8581
  publicScheme: http
webServer:
  port: 8082
  publicHost: localhost
  publicPort: 8582
  publicScheme: http
database:
  host: postgres
  port: 5432
  name: ai_gateway
  user: postgres
redis:
  enabled: false
  host: redis
  port: 6379
maxRequestSize: 262144
futureCall:
  concurrencyLimit: 2
  scanInterval: 1000
sessionLogs:
  persistentEnabled: true
  consoleEnabled: true
  consoleLogFormat: text
