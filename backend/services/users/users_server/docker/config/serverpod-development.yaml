# Configuration for the Serverpod API when it runs inside Docker Compose.
apiServer:
  port: 8080
  publicHost: localhost
  publicPort: 8380
  publicScheme: http

insightsServer:
  port: 8081
  publicHost: localhost
  publicPort: 8381
  publicScheme: http

webServer:
  port: 8082
  publicHost: localhost
  publicPort: 8382
  publicScheme: http

database:
  host: postgres
  port: 5432
  name: users
  user: postgres

redis:
  enabled: true
  host: redis
  port: 6379

maxRequestSize: 524288

sessionLogs:
  persistentEnabled: true
  consoleEnabled: true
  consoleLogFormat: text
