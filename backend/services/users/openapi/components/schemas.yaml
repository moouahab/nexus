$schema: https://json-schema.org/draft/2020-12/schema
$defs:
  UserProfile:
    type: object
    additionalProperties: false
    required: [id, identityId, displayName, kind, status, createdAt]
    properties:
      id: { type: string, format: uuid }
      identityId: { type: string, format: uuid }
      displayName: { type: string }
      kind: { type: string, enum: [consultant, organizationMember] }
      status: { type: string, enum: [active, suspended, deleted] }
      primaryPartyId: { type: string, format: uuid }
      email: { type: string, format: email }
      avatarUri: { type: string, format: uri }
      bio: { type: string }
      locale: { type: string }
      timezone: { type: string }
      metadata:
        type: object
        additionalProperties: { type: string }
      createdAt: { type: string, format: date-time }
      updatedAt: { type: string, format: date-time }
  CompleteProfile:
    type: object
    additionalProperties: false
    required: [displayName]
    properties:
      identityId: { type: string, format: uuid }
      displayName: { type: string, minLength: 1 }
      kind: { type: string, enum: [consultant, organizationMember], default: consultant }
      primaryPartyId: { type: string, format: uuid }
      email: { type: string, format: email }
      avatarUri: { type: string, format: uri }
      bio: { type: string }
      locale: { type: string }
      timezone: { type: string }
      metadata:
        type: object
        additionalProperties: { type: string }
  PrimaryPartyUpdate:
    type: object
    additionalProperties: false
    properties:
      primaryPartyId:
        oneOf:
          - { type: string, format: uuid }
          - { type: 'null' }
  Error:
    type: object
    additionalProperties: false
    required: [error]
    properties:
      error:
        type: object
        additionalProperties: false
        required: [code]
        properties:
          code:
            type: string
            enum: [AUTH_REQUIRED, ACCESS_DENIED, INVALID_REQUEST, VALIDATION_FAILED, RESOURCE_NOT_FOUND, RESOURCE_CONFLICT, INVALID_STATE, INTERNAL_ERROR]
          message: { type: string }
