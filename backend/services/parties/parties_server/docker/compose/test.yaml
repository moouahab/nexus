services:
  postgres_test:
    profiles:
      - test
    build:
      context: ../../../../../infrastructure/service-runtime/docker/postgres
    user: "0:0"
    ports:
      - "127.0.0.1:${POSTGRES_TEST_PORT:-9490}:5432"
    configs:
      - source: postgres_test_config
        target: /run/config/postgres.conf
    secrets:
      - source: postgres_test_password
        target: postgres_password
    volumes:
      - parties_test_data:/var/lib/postgresql/data
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
      - /var/run/postgresql:size=16m,noexec,nosuid,nodev
    pids_limit: 200
    mem_limit: 1g
    cpus: 1.0
    security_opt:
      - no-new-privileges:true

  redis_test:
    profiles:
      - test
    build:
      context: ../../../../../infrastructure/service-runtime/docker/redis
    user: "0:0"
    ports:
      - "127.0.0.1:${REDIS_TEST_PORT:-9491}:6379"
    secrets:
      - source: redis_test_password
        target: redis_password
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    tmpfs:
      - /data:size=64m,noexec,nosuid,nodev
      - /tmp:size=16m,noexec,nosuid,nodev
    pids_limit: 100
    mem_limit: 256m
    cpus: 0.50
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/secrets/redis_password)\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
