name: nexus-observability

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.5
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.ml.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      cluster.name: nexus-local
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - observability
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    cpus: 1.5
    pids_limit: 512
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.5
    restart: unless-stopped
    user: "0:0"
    environment:
      LS_JAVA_OPTS: -Xms256m -Xmx256m
      XPACK_MONITORING_ENABLED: "false"
    ports:
      - "127.0.0.1:9600:9600"
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - logstash_data:/usr/share/logstash/data
    networks:
      - observability
    depends_on:
      elasticsearch:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,nosuid,nodev,mode=1777
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9600/_node/pipelines >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 45s

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.5
    restart: unless-stopped
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
      SERVER_PUBLICBASEURL: http://localhost:5601
      TELEMETRY_ENABLED: "false"
      XPACK_REPORTING_ROLES_ENABLED: "false"
      NODE_OPTIONS: --max-old-space-size=512
    ports:
      - "127.0.0.1:5601:5601"
    networks:
      - observability
    depends_on:
      elasticsearch:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 256
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5601/api/status >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 45s

  kibana-setup:
    image: curlimages/curl:8.10.1
    restart: "no"
    command: ["/bin/sh", "/setup/provision.sh"]
    volumes:
      - ./kibana:/setup:ro
    networks:
      - observability
    depends_on:
      kibana:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m,nosuid,nodev,mode=1777
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 64

networks:
  observability:
    name: nexus_observability
    internal: true

volumes:
  elasticsearch_data:
  logstash_data:
