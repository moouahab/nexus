input {
  file {
    path => "/var/lib/docker/containers/*/*-json.log"
    mode => "tail"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/plugins/inputs/file/docker.sincedb"
    codec => json
    exclude => ["*.gz"]
  }
}

filter {
  # Docker's json-file driver wraps stdout in {log,stream,time}. Keep the raw
  # line for troubleshooting, then promote NEXUS structured JSON fields.
  mutate {
    rename => { "log" => "[event][original]" }
    rename => { "stream" => "[log][stream]" }
  }
  date {
    match => ["time", "ISO8601"]
    target => "@timestamp"
  }
  mutate { remove_field => ["time", "host"] }

  grok {
    match => { "[log][file][path]" => "/var/lib/docker/containers/%{DATA:[container][id]}/" }
    tag_on_failure => []
  }

  if [event][original] =~ /^\s*\{/ {
    json {
      source => "[event][original]"
      target => "nexus"
      tag_on_failure => ["_nexus_json_parse_failure"]
    }
  }

  if [nexus] {
    mutate {
      rename => { "[nexus][event]" => "[event][action]" }
      rename => { "[nexus][service]" => "[service][name]" }
      rename => { "[nexus][request_id]" => "[http][request][id]" }
      rename => { "[nexus][method]" => "[http][request][method]" }
      rename => { "[nexus][status_code]" => "[http][response][status_code]" }
      rename => { "[nexus][duration_ms]" => "[event][duration_ms]" }
      rename => { "[nexus][queue_wait_ms]" => "[ai][queue_wait_ms]" }
      rename => { "[nexus][outcome]" => "[event][outcome]" }
      rename => { "[nexus][reasoning_level]" => "[ai][reasoning_level]" }
    }
    if [nexus][timestamp] {
      date { match => ["[nexus][timestamp]", "ISO8601"] target => "@timestamp" }
    }
    mutate { remove_field => ["nexus"] }
  }

  if ![service][name] {
    mutate { add_field => { "[service][name]" => "docker" } }
  }
  if [http][response][status_code] and [http][response][status_code] >= 500 {
    mutate { add_tag => ["http_server_error"] }
  } else if [http][response][status_code] and [http][response][status_code] >= 400 {
    mutate { add_tag => ["http_client_error"] }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "nexus-logs-%{+YYYY.MM.dd}"
    template => "/usr/share/logstash/pipeline/nexus-template.json"
    template_name => "nexus-logs"
    template_overwrite => true
    ilm_enabled => false
  }
}
