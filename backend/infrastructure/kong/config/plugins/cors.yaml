  - name: cors
    config:
      origins:
        - http://localhost:3000
        - http://localhost:5173
        - http://localhost:8080
        - http://127.0.0.1:3000
        - http://127.0.0.1:5173
        - http://127.0.0.1:8080
        - http://identity.nexus.local:8080
      methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
      headers:
        - Accept
        - Authorization
        - Content-Type
        - X-Auth-Token-Transport
        - X-CSRF-Token
        - X-Request-Id
      exposed_headers: [X-Request-Id]
      credentials: true
      max_age: 3600
