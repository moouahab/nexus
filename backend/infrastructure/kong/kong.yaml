_format_version: "3.0"
_transform: true

services:
  - name: identity-auth-web
    url: http://identity-api:8082/auth
    connect_timeout: 5000
    write_timeout: 15000
    read_timeout: 15000
    retries: 2
    routes:
      - name: v1-auth
        paths: [/v1/auth]
        strip_path: true
        preserve_host: false
        protocols: [http, https]

  - name: identity-well-known-web
    url: http://identity-api:8082/.well-known
    connect_timeout: 5000
    write_timeout: 15000
    read_timeout: 15000
    retries: 2
    routes:
      - name: well-known
        paths: [/.well-known]
        strip_path: true
        preserve_host: false
        protocols: [http, https]

  - name: users-rest
    url: http://users-api:8082
    connect_timeout: 5000
    write_timeout: 15000
    read_timeout: 15000
    retries: 2
    routes:
      - name: v1-users-rest
        paths: [/v1/users]
        strip_path: true
        preserve_host: false
        protocols: [http, https]

  - name: users-serverpod-rpc
    url: http://users-api:8080/user
    connect_timeout: 5000
    write_timeout: 15000
    read_timeout: 15000
    retries: 2
    routes:
      - name: v1-users-rpc-compat
        paths: ["~/v1/users/user$", /v1/users/user/]
        strip_path: true
        preserve_host: false
        protocols: [http, https]

  - name: parties-rest
    url: http://parties-api:8082
    connect_timeout: 5000
    write_timeout: 15000
    read_timeout: 15000
    retries: 2
    routes:
      - name: v1-parties-rest
        paths: [/v1/parties]
        strip_path: true
        preserve_host: false
        protocols: [http, https]

  - name: parties-serverpod-rpc
    url: http://parties-api:8080/party
    connect_timeout: 5000
    write_timeout: 15000
    read_timeout: 15000
    retries: 2
    routes:
      - name: v1-parties-rpc-compat
        paths: ["~/v1/parties/party$", /v1/parties/party/]
        strip_path: true
        preserve_host: false
        protocols: [http, https]

  - name: projects-rest
    url: http://projects-api:8082
    connect_timeout: 5000
    write_timeout: 15000
    read_timeout: 15000
    retries: 2
    routes:
      - name: v1-projects-rest
        paths: [/v1/projects]
        strip_path: true
        preserve_host: false
        protocols: [http, https]

  - name: projects-serverpod-rpc
    url: http://projects-api:8080/project
    connect_timeout: 5000
    write_timeout: 15000
    read_timeout: 15000
    retries: 2
    routes:
      - name: v1-projects-rpc-compat
        paths: ["~/v1/projects/project$", /v1/projects/project/]
        strip_path: true
        preserve_host: false
        protocols: [http, https]

  - name: ai-gateway-rest
    url: http://ai-gateway-api:8082
    connect_timeout: 5000
    write_timeout: 30000
    read_timeout: 30000
    retries: 1
    routes:
      - name: v1-ai-rest
        paths: [/v1/ai]
        strip_path: true
        preserve_host: false
        protocols: [http, https]
    plugins:
      - name: rate-limiting
        config:
          minute: 60
          policy: local
          hide_client_headers: false

plugins:
  - name: correlation-id
    config:
      header_name: x-request-id
      generator: uuid
      echo_downstream: true

  - name: pre-function
    config:
      access:
        - |
          local authorization = kong.request.get_header("authorization")
          if authorization and not string.match(
            authorization,
            "^[Bb][Ee][Aa][Rr][Ee][Rr]%s+[A-Za-z0-9_%-%.]+$"
          ) then
            return kong.response.exit(
              401,
              { error = "invalid_access_token" },
              { ["Content-Type"] = "application/json" }
            )
          end

  - name: cors
    config:
      origins:
        - http://localhost:3000
        - http://localhost:5173
        - http://localhost:8080
        - http://127.0.0.1:3000
        - http://127.0.0.1:5173
        - http://127.0.0.1:8080
        - http://identity.nexus.local:8080
      methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
      headers:
        - Accept
        - Authorization
        - Content-Type
        - X-Auth-Token-Transport
        - X-CSRF-Token
        - X-Request-Id
      exposed_headers: [X-Request-Id]
      credentials: true
      max_age: 3600

  - name: rate-limiting
    config:
      minute: 600
      policy: local
      hide_client_headers: false
