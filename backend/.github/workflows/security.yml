name: Backend Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '37 3 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-history:
    name: Secret history
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Scan complete Git history
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --config /repo/security/gitleaks.toml --redact --verbose

  filesystem:
    name: Dependencies, secrets and IaC
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Trivy filesystem scan
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" \
            ghcr.io/aquasecurity/trivy:0.74.0 \
            fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL \
            --ignore-unfixed --exit-code 1 /repo

  sast:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: semgrep/semgrep:1.136.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Security rules
        run: |
          mkdir -p security/reports
          semgrep scan --config p/security-audit --config p/secrets \
            --config security/semgrep/nexus.yml --metrics=off \
            --json --json-output=security/reports/semgrep.json .
      - name: Normalize and gate confirmed findings
        if: always()
        run: python3 security/scripts/normalize_findings.py --gate
      - name: Upload machine-readable findings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nexus-security-findings
          path: |
            security/reports/semgrep.json
            security/reports/findings.json
          if-no-files-found: error

  pentest-tooling:
    name: Pentest guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate scripts
        run: |
          bash -n security/scripts/run_static.sh security/scripts/run_dast.sh \
            security/scripts/backup_restore_test.sh security/scripts/resilience_test.sh
          python3 -m unittest discover -s security/tests -v
